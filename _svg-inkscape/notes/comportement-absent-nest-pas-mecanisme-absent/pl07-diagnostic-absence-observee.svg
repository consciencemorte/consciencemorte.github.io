<svg xmlns="http://www.w3.org/2000/svg" class="cm-diagram cm-note-07" viewBox="0 0 1536 1024" role="img" aria-labelledby="t2 d2" preserveAspectRatio="xMidYMid meet">
  <title id="t2">Que signifie une absence observée ?</title>
  <desc id="d2">Schéma diagnostique montrant qu’une absence comportementale peut correspondre à plusieurs états internes : circuit détruit, désactivé, contourné ou difficile d’accès. Une ligne méthodologique recommande prompts adversariaux, probing, steering et interventions causales.</desc>
