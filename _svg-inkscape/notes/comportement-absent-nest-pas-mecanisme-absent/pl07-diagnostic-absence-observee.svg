  <rect x="0" y="0" width="1536" height="1024" fill="none"/>
  <text x="72" y="70" class="plate">PL. 07 / DIAGNOSTIC</text>
  <line x1="72" y1="88" x2="1464" y2="88" class="paperline"/>
  <text x="768" y="150" class="title center">Que signifie une absence observée ?</text>
  <line x1="360" y1="168" x2="1176" y2="168" class="paperline"/>

  <!-- Central diagnostic structure -->
  <rect x="563" y="356" width="410" height="126" class="softbox"/>
  <text x="768" y="404" class="section center">Absence comportementale</text>
  <text x="768" y="438" class="caption center">constat d’entrée-sortie sur une distribution limitée</text>

  <!-- surrounding boxes -->
  <rect x="190" y="260" width="300" height="104" class="box"/>
  <text x="340" y="312" class="section center">Circuit détruit</text>

  <rect x="1046" y="260" width="300" height="104" class="box"/>
  <text x="1196" y="312" class="section center">Circuit désactivé</text>

  <rect x="190" y="520" width="300" height="104" class="box"/>
  <text x="340" y="572" class="section center">Circuit contourné</text>

  <rect x="1046" y="520" width="300" height="104" class="box"/>
  <text x="1196" y="560" class="section center">Circuit difficile</text>
  <text x="1196" y="590" class="section center" style="font-size:23px;">d’accès</text>

