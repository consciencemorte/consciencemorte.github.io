  <line x1="1076" y1="710" x2="1336" y2="710" class="oxide-stroke"/>
  <text x="768" y="712" class="mono center oxide" style="font-size:19px; font-weight:700;">UN TEST COMPORTEMENTAL SEUL EST INSUFFISANT</text>

  <!-- method boxes -->
  <rect x="176" y="766" width="252" height="78" class="softbox"/>
  <text x="302" y="798" class="label center">Prompts adversariaux</text>
  <text x="302" y="824" class="small center muted">éliciter le circuit silencieux</text>

  <line x1="428" y1="805" x2="500" y2="805" class="graphite-stroke" marker-end="url(#arrow2)"/>

  <rect x="504" y="766" width="220" height="78" class="softbox"/>
  <text x="614" y="798" class="label center">Probing</text>
  <text x="614" y="824" class="small center muted">représentation / accessibilité</text>

  <line x1="724" y1="805" x2="796" y2="805" class="graphite-stroke" marker-end="url(#arrow2)"/>

  <rect x="800" y="766" width="220" height="78" class="softbox"/>
  <text x="910" y="798" class="label center">Steering</text>
  <text x="910" y="824" class="small center muted">réouvrir le canal d’expression</text>

  <line x1="1020" y1="805" x2="1092" y2="805" class="graphite-stroke" marker-end="url(#arrow2)"/>

  <rect x="1096" y="766" width="264" height="78" class="box"/>
  <text x="1228" y="798" class="label center">Interventions causales</text>
  <text x="1228" y="824" class="small center muted">détruit, désactivé ou contourné ?</text>

  <line x1="72" y1="900" x2="1464" y2="900" class="paperline"/>
  <text x="768" y="954" class="caption center">Une sortie absente peut correspondre à plusieurs états internes différents.</text>
