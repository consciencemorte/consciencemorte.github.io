  .cm-note-pl04-quatre-regimes .subtitle { font: 500 25px/1.2 "Newsreader", Georgia, serif; }
  .cm-note-pl04-quatre-regimes .section { font: 600 13px/1.2 "Inter", Arial, sans-serif; letter-spacing: .11em; }
