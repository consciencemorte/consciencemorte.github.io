<text x="55" y="46" class="mono accent-text">PL. 04 / RÉGIMES</text>
<line x1="55" y1="62" x2="1145" y2="62" class="line"/>
<text x="600" y="116" class="title center">Quatre observations possibles</text>
<text x="600" y="145" class="mono-small muted center">DEUX MESURES SUR LE MÊME ÉTAT · PAS UNE IDENTITÉ DE DIRECTION</text>

<!-- quadrant highlights -->
<rect x="250" y="190" width="350" height="205" class="oxide-wash" opacity="0.45"/>
<rect x="600" y="395" width="350" height="205" class="oxide-wash" opacity="0.45"/>
<!-- axes -->
<line x1="250" y1="600" x2="990" y2="600" class="ink-heavy" marker-end="url(#pl04-quatre-regimes-arrow-ink)"/>
<line x1="250" y1="600" x2="250" y2="160" class="ink-heavy" marker-end="url(#pl04-quatre-regimes-arrow-ink)"/>
<line x1="600" y1="190" x2="600" y2="600" class="line"/>
<line x1="250" y1="395" x2="950" y2="395" class="line"/>
<text x="600" y="642" class="label center">effet du patching</text>
<text x="250" y="670" class="mono-small center">FAIBLE</text>
<text x="950" y="670" class="mono-small center">FORTE</text>
<text x="115" y="395" class="label center" transform="rotate(-90 115 395)">décodabilité linéaire</text>
<text x="205" y="600" class="mono-small right">FAIBLE</text>
<text x="205" y="190" class="mono-small right">FORTE</text>

<!-- top-left -->
<text x="425" y="245" class="subtitle center">décodable, peu influent</text>
<rect x="316" y="282" width="18" height="18" class="hatch-fill"/>
<text x="348" y="296" class="small">token objet tardif</text>
<text x="425" y="332" class="mono-small muted center">PROBE FORT · PATCHING SANS EFFET</text>

<!-- top-right -->
<text x="775" y="245" class="subtitle center">décodable et influent</text>
<rect x="672" y="282" width="18" height="18" class="ink"/>
<circle cx="681" cy="291" r="4" class="oxide-fill"/>
<text x="704" y="296" class="small">CLS final</text>
<text x="775" y="332" class="mono-small muted center">DEUX INDICES FORTS · DIRECTION NON IDENTIFIÉE</text>

<!-- bottom-left -->
<text x="425" y="456" class="subtitle center">ni décodé</text>
<text x="425" y="484" class="subtitle center">ni influent dans ces tests</text>
<rect x="316" y="505" width="18" height="18" class="ink"/>
<text x="348" y="519" class="small">aucun effet détecté</text>
<text x="425" y="555" class="mono-small muted center">CONCLUSION LIMITÉE AUX DEUX TESTS</text>

<!-- bottom-right -->
<text x="775" y="456" class="subtitle accent-text center">peu décodable,</text>
<text x="775" y="485" class="subtitle accent-text center">mais influent</text>
<rect x="672" y="515" width="18" height="18" class="oxide-wash"/>
<text x="704" y="529" class="small">token objet intermédiaire</text>
<text x="775" y="563" class="mono-small muted center">PATCHING FORT · PROBE LINÉAIRE FAIBLE</text>

<line x1="55" y1="705" x2="1145" y2="705" class="line"/>
<text x="600" y="742" class="caption center">Le croisement localise un écart ; il n’identifie pas, à lui seul, le mécanisme qui le produit.</text>
<text x="55" y="775" class="mono-small muted">UN EFFET DE PATCHING PORTE SUR L’ÉTAT REMPLACÉ, PAS NÉCESSAIREMENT SUR LA DIRECTION DÉCODÉE</text>

</svg>
