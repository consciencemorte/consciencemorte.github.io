<svg class="cm-diagram cm-note-pl04-quatre-regimes" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="pl04-quatre-regimes-title pl04-quatre-regimes-desc" preserveAspectRatio="xMidYMid meet">
<title id="pl04-quatre-regimes-title">Quatre observations possibles</title>
<desc id="pl04-quatre-regimes-desc">Matrice deux par deux croisant la décodabilité linéaire d’un état et l’effet de son remplacement sur la sortie.</desc>

<style>
