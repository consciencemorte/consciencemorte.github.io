<title id="cm-05-t">Quand la carte passe dans le terrain</title>
<desc id="cm-05-d">Triptyque inspiré des forêts administratives décrites par James Scott. Une forêt hétérogène est réduite à un tableau de volume, d’âge et de rendement ; cette représentation devient ensuite le plan d’une forêt homogène plantée en rangées.</desc>
