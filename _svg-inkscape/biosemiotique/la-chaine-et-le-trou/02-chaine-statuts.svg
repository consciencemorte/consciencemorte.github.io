<svg xmlns="http://www.w3.org/2000/svg" class="cm-diagram cm-02" viewBox="0 0 1000 640" role="img" aria-labelledby="cm-02-t cm-02-d"><title id="cm-02-t">Les cinq maillons de la chaîne et le statut de chacun</title><desc id="cm-02-d">La première partie de What Failure Looks Like est décomposée en cinq prémisses alignées de gauche à droite. Chaque maillon porte une trame indiquant son statut. Le premier, la conversion de l’intention en dispositif, et le troisième, la divergence du proxy sous pression, sont pleins : ce sont les maillons établis. Le deuxième, la boucle rapide réservée au mesurable, est tramé de bleu et bordé de pointillés : il repose sur une hypothèse de vitesse relative que Rohin Shah conteste. Le quatrième, la correction qui retombe sous la mesure, est tramé de mousse : plausible et partiellement étayé, il décrit une branche possible sans établir que les autres cessent d’être praticables. Le cinquième, le verrouillage de la dérive, est vide, bordé d’oxyde discontinu : son mécanisme n’est pas fourni. Une ligne d’oxyde verticale coupe la planche juste avant lui : c’est le seuil non dérivé. Sous la planche, deux accolades montrent ce que chaque partie de la chaîne peut soutenir. Les quatre premiers maillons produisent une dysfonction durable ; le cinquième doit à lui seul établir une dépossession complète et sans retour.</desc><defs><pattern id="cm-02-ink" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="cm-02-p0" x1="0" y1="0" x2="0" y2="7" style="stroke:#1c1c18;stroke-width:.6;opacity:.5"></line></pattern><pattern id="cm-02-bl" width="6" height="6" patternUnits="userSpaceOnUse"><circle class="cm-02-p1" cx="3" cy="3" r="0.85" style="fill:#2d5b8a;opacity:.55"></circle></pattern><pattern id="cm-02-ms" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line class="cm-02-p2" x1="0" y1="0" x2="0" y2="8" style="stroke:#52634e;stroke-width:.6;opacity:.55"></line></pattern><marker id="cm-02-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="cm-02-p3" d="M1 1l8 4-8 4" style="fill:none;stroke:#1c1c18;stroke-width:1.3"></path></marker><marker id="cm-02-arox" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="cm-02-p4" d="M1 1l8 4-8 4" style="fill:none;stroke:#a84e2f;stroke-width:1.3"></path></marker></defs>

