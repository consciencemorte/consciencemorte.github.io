<svg xmlns="http://www.w3.org/2000/svg" class="cm-diagram cm-03" viewBox="0 0 1000 686" role="img" aria-labelledby="cm-03-t cm-03-d"><title id="cm-03-t">Les quatre échelles de l’argument et les jointures non vérifiées</title><desc id="cm-03-d">Les prémisses de What Failure Looks Like n’opèrent pas toutes à la même échelle. Quatre bandes sont empilées, de la plus étroite à la plus large. En bas, la relation entre une propriété et sa mesure, où opèrent les maillons un et trois, tous deux établis. Au-dessus, la procédure de sélection, où opère le maillon deux, contesté. Au-dessus encore, l’organisation qui corrige et délègue, où opère le maillon quatre, plausible. Tout en haut, la civilisation, qu’aucun maillon n’établit : sa bande est vide et bordée d’oxyde discontinu. Le même glyphe — une propriété, sa mesure, et l’écart qui les sépare — est répété à l’identique dans chaque bande : c’est l’agnosticisme de Christiano quant au substrat, qui permet de décrire ces objets différents comme les instances d’un même processus de sélection. Entre les bandes, trois flèches montantes portent une question. Elles marquent les jointures : le mécanisme se répète à chaque échelle, mais rien n’établit que ses effets se transmettent de l’une à l’autre, ni que les écarts locaux s’additionnent plutôt qu’ils ne se compensent.</desc><defs><pattern id="cm-03-ink" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="cm-03-p0" x1="0" y1="0" x2="0" y2="7" style="stroke:#1c1c18;stroke-width:.6;opacity:.5"></line></pattern><pattern id="cm-03-bl" width="6" height="6" patternUnits="userSpaceOnUse"><circle class="cm-03-p1" cx="3" cy="3" r="0.85" style="fill:#2d5b8a;opacity:.55"></circle></pattern><pattern id="cm-03-ms" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line class="cm-03-p2" x1="0" y1="0" x2="0" y2="8" style="stroke:#52634e;stroke-width:.6;opacity:.55"></line></pattern><marker id="cm-03-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="cm-03-p3" d="M1 1l8 4-8 4" style="fill:none;stroke:#1c1c18;stroke-width:1.3"></path></marker><marker id="cm-03-arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path class="cm-03-p4" d="M1 1l8 4-8 4" style="fill:none;stroke:#a84e2f;stroke-width:1.3"></path></marker></defs>

<text x="60" y="28" class="l ox h" style="fill:#a84e2f;font-family:&#34;IBM Plex Mono&#34;,ui-monospace,monospace;font-size:11.5px;font-weight:500;letter-spacing:.05em;paint-order:stroke;stroke:#f3efe6;stroke-width:3px;stroke-linejoin:round">PL. 03 / COMPOSITION DES PRÉMISSES</text><text x="940" y="28" text-anchor="end" class="ll h" style="fill:#57564f;font-family:&#34;IBM Plex Mono&#34;,ui-monospace,monospace;font-size:10.5px;font-weight:500;letter-spacing:.07em;paint-order:stroke;stroke:#f3efe6;stroke-width:3px;stroke-linejoin:round">QUATRE ÉCHELLES · TROIS JOINTURES</text><path d="M52 52H948" class="r" style="fill:none;stroke:#1c1c18;stroke-width:1;vector-effect:non-scaling-stroke"></path>
<text x="60" y="96" class="ts" style="fill:#1c1c18;font-family:&#34;Newsreader&#34;,Georgia,serif;font-size:25px;font-weight:500;letter-spacing:-.015em">Ce qui vaut d’une échelle vaut-il des autres ?</text><text x="60" y="119" class="ll" style="fill:#57564f;font-family:&#34;IBM Plex Mono&#34;,ui-monospace,monospace;font-size:10.5px;font-weight:500;letter-spacing:.07em">LE MÊME MÉCANISME EST RÉPÉTÉ DANS CHAQUE BANDE · CE QUI N’EST PAS ÉTABLI, C’EST LE PASSAGE DE L’UNE À L’AUTRE</text>

<text x="60" y="152" class="ll" style="fill:#57564f;font-family:&#34;IBM Plex Mono&#34;,ui-monospace,monospace;font-size:10.5px;font-weight:500;letter-spacing:.07em">ÉCHELLE</text><text x="270" y="152" class="ll" style="fill:#57564f;font-family:&#34;IBM Plex Mono&#34;,ui-monospace,monospace;font-size:10.5px;font-weight:500;letter-spacing:.07em">CE QUE LA PRÉMISSE Y DÉCRIT</text><text x="800" y="152" text-anchor="end" class="ll" style="fill:#57564f;font-family:&#34;IBM Plex Mono&#34;,ui-monospace,monospace;font-size:10.5px;font-weight:500;letter-spacing:.07em">STATUT</text>

