<svg class="cm-diagram cm-note-pl06-specificite" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="pl06sp-title pl06sp-desc" preserveAspectRatio="xMidYMid meet">
<title id="pl06sp-title">Discriminant n’est pas spécifique</title>
<desc id="pl06sp-desc">À gauche, une direction sépare correctement deux classes d’états internes : le probe atteint 71,6 pour cent d’exactitude équilibrée. À droite, la même direction est décomposée : sa composante se situe très majoritairement dans le sous-espace critique pour la tâche, avec 85 à 88 pour cent de recouvrement et un ratio de spécificité inférieur ou égal à 0,152. Injecter le long de cette direction déplace donc le calcul de la tâche autant que le régime d’échec visé, ce qui produit un effet net nul.</desc>

<style>
  .cm-note-pl06-specificite { color: var(--ink, #1c1c18); background: transparent; }
  .cm-note-pl06-specificite text { fill: var(--ink, #1c1c18); }
  .cm-note-pl06-specificite .ink { fill: none; stroke: var(--ink, #1c1c18); stroke-width: 1.35; vector-effect: non-scaling-stroke; }
  .cm-note-pl06-specificite .ink-heavy { fill: none; stroke: var(--ink, #1c1c18); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .cm-note-pl06-specificite .graphite { fill: var(--graphite, #57564f); stroke: none; }
  .cm-note-pl06-specificite .graphite-line { fill: none; stroke: var(--graphite, #57564f); stroke-width: 1.15; vector-effect: non-scaling-stroke; }
  .cm-note-pl06-specificite .line { fill: none; stroke: var(--line, #c9c1b3); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .cm-note-pl06-specificite .oxide { fill: none; stroke: var(--oxide, #a84e2f); stroke-width: 2.2; vector-effect: non-scaling-stroke; }
  .cm-note-pl06-specificite .oxide-thin { fill: none; stroke: var(--oxide, #a84e2f); stroke-width: 1.25; vector-effect: non-scaling-stroke; }
  .cm-note-pl06-specificite .oxide-fill { fill: var(--oxide, #a84e2f); stroke: none; }
  .cm-note-pl06-specificite .oxide-wash { fill: var(--oxide, #a84e2f); fill-opacity: .10; stroke: var(--oxide, #a84e2f); stroke-width: 1.1; vector-effect: non-scaling-stroke; }
  .cm-note-pl06-specificite .paper-deep { fill: var(--paper-deep, #e8e0d2); fill-opacity: .58; stroke: none; }
  .cm-note-pl06-specificite .card { fill: none; stroke: var(--line, #c9c1b3); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .cm-note-pl06-specificite .hatch-fill { fill: url(#pl06sp-hatch); stroke: var(--graphite, #57564f); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .cm-note-pl06-specificite .title { font: 500 42px/1.1 "Newsreader", Georgia, serif; letter-spacing: -0.02em; }
  .cm-note-pl06-specificite .subtitle { font: 500 22px/1.2 "Newsreader", Georgia, serif; }
  .cm-note-pl06-specificite .label { font: 500 15px/1.3 "Inter", Arial, sans-serif; }
  .cm-note-pl06-specificite .small { font: 500 12px/1.35 "Inter", Arial, sans-serif; }
  .cm-note-pl06-specificite .mono { font: 500 11px/1.3 "IBM Plex Mono", monospace; letter-spacing: .06em; }
  .cm-note-pl06-specificite .mono-small { font: 500 9px/1.3 "IBM Plex Mono", monospace; letter-spacing: .08em; }
  .cm-note-pl06-specificite .caption { font: 400 17px/1.4 "Newsreader", Georgia, serif; font-style: italic; }
  .cm-note-pl06-specificite .muted { fill: var(--graphite, #57564f); }
  .cm-note-pl06-specificite .accent-text { fill: var(--oxide, #a84e2f); }
  .cm-note-pl06-specificite .center { text-anchor: middle; }
  .cm-note-pl06-specificite .right { text-anchor: end; }
  .cm-note-pl06-specificite .dashed { stroke-dasharray: 5 5; }
</style>

<defs>
  <pattern id="pl06sp-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
    <line x1="0" y1="0" x2="0" y2="8" stroke="var(--graphite, #57564f)" stroke-width="0.7" opacity="0.35"/>
  </pattern>
  <marker id="pl06sp-arrow-ink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--ink, #1c1c18)"/>
  </marker>
  <marker id="pl06sp-arrow-oxide" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--oxide, #a84e2f)"/>
  </marker>
  <marker id="pl06sp-arrow-graphite" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--graphite, #57564f)"/>
  </marker>
</defs>

<text x="55" y="46" class="mono accent-text">PL. 06 / SPÉCIFICITÉ</text>
<line x1="55" y1="62" x2="1145" y2="62" class="line"/>
<text x="600" y="116" class="title center">Discriminant n’est pas spécifique</text>
<text x="600" y="145" class="mono-small muted center">POURQUOI UNE DIRECTION BIEN SÉPARANTE PEUT NE RIEN PILOTER · D’APRÈS LIU (2026)</text>

