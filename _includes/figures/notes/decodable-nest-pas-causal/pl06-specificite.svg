<circle cx="393.0" cy="322.8" r="4.5" class="oxide-fill"/>

<!-- separating hyperplane : perpendicular to (160,-52) through midpoint (292,326) -->
<line x1="253" y1="446" x2="331" y2="206" class="ink-heavy"/>
<text x="352" y="200" class="mono-small muted">HYPERPLAN SÉPARATEUR</text>

<!-- normal direction d_OT -->
<line x1="255" y1="405" x2="368" y2="368" class="oxide" marker-end="url(#pl06sp-arrow-oxide)"/>
<text x="378" y="372" class="label accent-text">d<tspan baseline-shift="sub" font-size="10">OT</tspan></text>

<circle cx="97" cy="470" r="4.5" class="graphite"/>
<text x="112" y="474" class="small muted">réponse normale</text>
<circle cx="257" cy="470" r="4.5" class="oxide-fill"/>
<text x="272" y="474" class="small muted">régime d’overthinking</text>

<rect x="79" y="496" width="472" height="58" class="oxide-wash"/>
<text x="315" y="519" class="mono-small center">CONCLUSION</text>
<text x="315" y="541" class="label center accent-text">71,6 % d’exactitude équilibrée · p &lt; 10⁻¹⁶</text>

<!-- ===== RIGHT PANEL : ce que fait l'injection ===== -->
<rect x="625" y="176" width="520" height="400" class="card"/>
<text x="649" y="208" class="mono accent-text">02 · CE QUE FAIT L’INJECTION</text>
<line x1="649" y1="220" x2="1121" y2="220" class="line"/>

<!-- task-critical subspace band -->
<g transform="rotate(-25 860 380)">
  <rect x="670" y="342" width="400" height="76" class="hatch-fill"/>
</g>
<text x="668" y="454" class="mono-small muted" transform="rotate(-25 668 454)">SOUS-ESPACE CRITIQUE POUR LA TÂCHE</text>

<!-- origin -->
<circle cx="740" cy="424" r="4" class="ink-heavy"/>

<!-- parallel component (inside the band) -->
<line x1="740" y1="424" x2="974" y2="315" class="graphite-line" marker-end="url(#pl06sp-arrow-graphite)"/>
<!-- orthogonal component (short) -->
<line x1="974" y1="315" x2="960" y2="286" class="oxide" marker-end="url(#pl06sp-arrow-oxide)"/>
<!-- d_OT itself -->
<line x1="740" y1="424" x2="960" y2="286" class="oxide dashed"/>
<text x="972" y="278" class="label accent-text">d<tspan baseline-shift="sub" font-size="10">OT</tspan></text>

<line x1="890" y1="372" x2="866" y2="424" class="line"/>
<text x="862" y="440" class="mono-small muted right">85–88 % DE RECOUVREMENT</text>
<line x1="967" y1="300" x2="1030" y2="268" class="line"/>
<text x="1036" y="266" class="mono-small accent-text">RATIO DE SPÉCIFICITÉ ≤ 0,152</text>

<rect x="649" y="496" width="472" height="58" class="oxide-wash"/>
<text x="885" y="519" class="mono-small center">CONCLUSION</text>
<text x="885" y="541" class="label center accent-text">5 familles · 29 configurations · n = 1 273 · Δ ≈ 0</text>

<!-- bridge -->
<text x="600" y="613" class="label center">Pousser le long de d<tspan baseline-shift="sub" font-size="10">OT</tspan> déplace le calcul de la tâche autant que le régime d’échec visé.</text>
<text x="600" y="637" class="small center muted">Le probe mesure une séparation ; le steering exige en plus que la direction soit isolable du reste du calcul.</text>

<line x1="55" y1="665" x2="1145" y2="665" class="line"/>
<text x="600" y="703" class="caption center">L’échec du steering linéaire fixe n’est pas une absence d’information :</text>
<text x="600" y="729" class="caption center">c’est un défaut de spécificité de la direction extraite.</text>
<text x="55" y="760" class="mono-small muted">RÉSULTATS NULS RÉPLIQUÉS SUR QWEN2.5-7B ET MMLU-STEM · UN ADAPTATEUR NON LINÉAIRE APPRIS DONNE UN GAIN PRÉLIMINAIRE</text>

</svg>
