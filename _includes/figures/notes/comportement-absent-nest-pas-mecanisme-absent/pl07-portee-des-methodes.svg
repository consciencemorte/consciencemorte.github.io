    .cm-note-07 .graphite-stroke { stroke: var(--graphite, #5b5a54); stroke-width: 1.3; fill: none; }
    .cm-note-07 .oxide-stroke { stroke: var(--oxide, #a64b32); stroke-width: 1.6; fill: none; }
    .cm-note-07 .dot-full { fill: var(--ink, #1f1e1a); }
    .cm-note-07 .dot-open { fill: none; stroke: var(--graphite, #5b5a54); stroke-width: 1.6; }
    .cm-note-07 .muted { fill: var(--graphite, #5b5a54); }
    .cm-note-07 .oxide { fill: var(--oxide, #a64b32); }
