]]></style>
  </defs>

  <rect x="0" y="0" width="1536" height="1024" fill="transparent"/>
  <text x="72" y="70" class="plate">PL. 07 / PORTÉE DES MÉTHODES</text>
  <line x1="72" y1="88" x2="1464" y2="88" class="paperline"/>
  <text x="768" y="150" class="title center">Que teste chaque méthode ?</text>
  <line x1="440" y1="172" x2="1096" y2="172" class="paperline"/>

  <!-- Column headers -->
  <text x="760"  y="248" class="num center muted">01</text>
  <text x="1010" y="248" class="num center muted">02</text>
  <text x="1260" y="248" class="num center muted">03</text>
  <text x="760"  y="284" class="section center">Représentation</text>
  <text x="1010" y="284" class="section center">Accessibilité</text>
  <text x="1260" y="284" class="section center">Expression</text>
  <line x1="120" y1="310" x2="1400" y2="310" class="graphite-stroke"/>

  <!-- Row 1 : observation comportementale (bracket) -->
  <text x="580" y="350" class="label right">Observation comportementale</text>
  <path d="M655,338 L655,350 L1365,350 L1365,338" class="oxide-stroke"/>
  <text x="1010" y="376" class="mono oxide center">PORTE SUR LA CONJONCTION — NE LOCALISE PAS</text>
  <line x1="120" y1="398" x2="1400" y2="398" class="line-stroke"/>

  <!-- Row 2 : analyse des logits -->
  <text x="580" y="436" class="label right">Analyse des logits</text>
  <circle cx="1260" cy="436" r="11" class="dot-full"/>
  <line x1="120" y1="466" x2="1400" y2="466" class="line-stroke"/>

  <!-- Row 3 : probing -->
  <text x="580" y="496" class="label right">Probing</text>
  <circle cx="760" cy="496" r="11" class="dot-full"/>
  <circle cx="1010" cy="496" r="10" class="dot-open"/>
  <line x1="120" y1="526" x2="1400" y2="526" class="line-stroke"/>

  <!-- Row 4 : modification du contexte -->
  <text x="580" y="556" class="label right">Modification du contexte (prompt)</text>
  <circle cx="760" cy="556" r="10" class="dot-open"/>
  <circle cx="1010" cy="556" r="11" class="dot-full"/>
  <line x1="120" y1="586" x2="1400" y2="586" class="line-stroke"/>

  <!-- Row 5 : fine-tuning -->
  <text x="580" y="616" class="label right">Fine-tuning / relearning</text>
  <circle cx="760" cy="616" r="10" class="dot-open"/>
  <circle cx="1010" cy="616" r="11" class="dot-full"/>
  <line x1="120" y1="646" x2="1400" y2="646" class="line-stroke"/>

  <!-- Row 6 : steering -->
  <text x="580" y="676" class="label right">Steering</text>
  <circle cx="760" cy="676" r="10" class="dot-open"/>
  <circle cx="1010" cy="676" r="11" class="dot-full"/>
  <circle cx="1260" cy="676" r="10" class="dot-open"/>
  <line x1="120" y1="708" x2="1400" y2="708" class="line-stroke"/>

  <!-- Row 7 : interventions causales (bracket) -->
  <text x="580" y="746" class="label right">Interventions causales</text>
  <path d="M655,758 L655,746 L1365,746 L1365,758" class="oxide-stroke"/>
  <text x="1010" y="784" class="mono oxide center">TESTE LES DÉPENDANCES ENTRE NIVEAUX</text>
  <line x1="120" y1="806" x2="1400" y2="806" class="graphite-stroke"/>

  <!-- Legend -->
  <circle cx="132" cy="852" r="9" class="dot-full"/>
  <text x="152" y="852" class="small left muted">teste directement</text>
  <circle cx="340" cy="852" r="8" class="dot-open"/>
  <text x="360" y="852" class="small left muted">contraint indirectement</text>
  <text x="612" y="852" class="small left muted">case vide : hors de portée</text>
  <path d="M880,860 L880,852 L940,852 L940,860" class="oxide-stroke"/>
  <text x="958" y="852" class="small left muted">porte sur la conjonction ou la relation</text>

  <line x1="72" y1="900" x2="1464" y2="900" class="paperline"/>
  <text x="768" y="946" class="caption center">Aucune méthode ne couvre les trois niveaux à elle seule.</text>
  <text x="768" y="976" class="caption center">Une affirmation de suppression doit nommer le niveau testé et la méthode qui le teste.</text>
</svg>
