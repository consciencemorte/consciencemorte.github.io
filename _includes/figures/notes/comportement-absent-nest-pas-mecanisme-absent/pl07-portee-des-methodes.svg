<svg xmlns="http://www.w3.org/2000/svg" class="cm-diagram cm-note-07" viewBox="0 0 1536 1024" role="img" aria-labelledby="t7 d7" preserveAspectRatio="xMidYMid meet">
  <title id="t7">Que teste chaque méthode ?</title>
  <desc id="d7">Matrice croisant sept méthodes d'évaluation avec les trois niveaux représentation, accessibilité et expression. Un disque plein indique un test direct, un cercle vide une contrainte indirecte, une case vide un niveau hors de portée. L'observation comportementale et les interventions causales portent sur la conjonction ou la relation entre niveaux.</desc>
  <defs>
    <style><![CDATA[
