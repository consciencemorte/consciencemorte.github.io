<rect x="790" y="326" width="154" height="154" fill="url(#cm-01-hatch)" stroke="var(--oxide,#a84e2f)" stroke-width=".9"/>
<text x="867" y="349" text-anchor="middle" class="ll ox" style="fill:var(--oxide,#a84e2f);font-family:var(--font-code,&#34;IBM Plex Mono&#34;,ui-monospace,monospace);font-size:10.5px;font-weight:500;letter-spacing:.07em">B · MESURE</text>
<text x="867" y="378" text-anchor="middle" class="tt" style="fill:var(--ink,#1c1c18);font-family:var(--font-interface,&#34;Inter&#34;,Arial,sans-serif);font-size:12.5px;font-weight:500">dispositif</text>
<path d="M867 386V408" marker-end="url(#cm-01-arox)" style="fill:none;stroke:var(--oxide,#a84e2f);stroke-width:1.6"/>
