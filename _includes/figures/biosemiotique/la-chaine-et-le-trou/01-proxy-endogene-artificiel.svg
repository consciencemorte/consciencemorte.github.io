<svg xmlns="http://www.w3.org/2000/svg" class="cm-diagram cm-01" viewBox="0 0 1000 640" role="img" aria-labelledby="cm-01-t cm-01-d">
<title id="cm-01-t">Un même score ne signifie pas un même progrès</title>
<desc id="cm-01-d">Schéma causal, et non série de données. À partir d’une même situation initiale, deux interventions atteignent le même score final. La première améliore la propriété visée, ce qui fait monter le proxy. La seconde agit directement sur le dispositif de mesure : le proxy monte tandis que la propriété visée reste inchangée.</desc>
<defs>
<marker id="cm-01-arox" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l8 4-8 4" fill="none" stroke="var(--oxide,#a84e2f)" stroke-width="1.3"/></marker>
<marker id="cm-01-arms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l8 4-8 4" fill="none" stroke="var(--moss,#52634e)" stroke-width="1.3"/></marker>
<pattern id="cm-01-stip" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r=".65" fill="var(--graphite,#57564f)" opacity=".32"/><circle cx="0" cy="0" r=".65" fill="var(--graphite,#57564f)" opacity=".32"/></pattern>
<pattern id="cm-01-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="var(--oxide,#a84e2f)" stroke-width=".65" opacity=".35"/></pattern>
</defs>

<text x="60" y="28" class="l ox h" style="fill:var(--oxide,#a84e2f);font-family:var(--font-code,&#34;IBM Plex Mono&#34;,ui-monospace,monospace);font-size:11.5px;font-weight:500;letter-spacing:.05em;paint-order:stroke;stroke:var(--paper,#f3efe6);stroke-width:3px">PL. 01 / DIVERGENCE DU PROXY</text>
<text x="940" y="28" text-anchor="end" class="ll h" style="fill:var(--graphite,#57564f);font-family:var(--font-code,&#34;IBM Plex Mono&#34;,ui-monospace,monospace);font-size:10.5px;font-weight:500;letter-spacing:.07em;paint-order:stroke;stroke:var(--paper,#f3efe6);stroke-width:3px">MÊME SCORE FINAL · DEUX INTERVENTIONS</text>
<path d="M52 52H948" style="fill:none;stroke:var(--ink,#1c1c18);stroke-width:1;vector-effect:non-scaling-stroke"/>
<text x="60" y="96" class="ts" style="fill:var(--ink,#1c1c18);font-family:var(--font-editorial,&#34;Newsreader&#34;,Georgia,serif);font-size:25px;font-weight:500;letter-spacing:-.015em">Un même score ne signifie pas un même progrès</text>
<text x="60" y="119" class="ll" style="fill:var(--graphite,#57564f);font-family:var(--font-code,&#34;IBM Plex Mono&#34;,ui-monospace,monospace);font-size:10.5px;font-weight:500;letter-spacing:.07em">SCHÉMA CAUSAL — LES FLÈCHES REPRÉSENTENT DEUX INTERVENTIONS, PAS UNE SÉRIE DE DONNÉES</text>

<path d="M142 510V154M142 510H758" style="fill:none;stroke:var(--ink,#1c1c18);stroke-width:1;vector-effect:non-scaling-stroke"/>
<path d="M142 430H758M142 350H758M142 270H758M142 190H758" style="fill:none;stroke:var(--line,#c9c1b3);stroke-width:.8;stroke-dasharray:2 6;vector-effect:non-scaling-stroke"/>
<path d="M270 510V154M398 510V154M526 510V154M654 510V154" style="fill:none;stroke:var(--line,#c9c1b3);stroke-width:.8;stroke-dasharray:2 6;vector-effect:non-scaling-stroke"/>
