<text x="450" y="555" text-anchor="middle" class="l" style="fill:var(--graphite,#57564f);font-family:var(--font-code,&#34;IBM Plex Mono&#34;,ui-monospace,monospace);font-size:11.5px;font-weight:500;letter-spacing:.05em">PROPRIÉTÉ VISÉE</text>
<text x="132" y="514" text-anchor="end" class="ll" style="fill:var(--graphite,#57564f);font-family:var(--font-code,&#34;IBM Plex Mono&#34;,ui-monospace,monospace);font-size:10.5px;font-weight:500;letter-spacing:.07em">faible</text>
<text x="132" y="160" text-anchor="end" class="ll" style="fill:var(--graphite,#57564f);font-family:var(--font-code,&#34;IBM Plex Mono&#34;,ui-monospace,monospace);font-size:10.5px;font-weight:500;letter-spacing:.07em">élevé</text>
<text x="142" y="532" class="ll" style="fill:var(--graphite,#57564f);font-family:var(--font-code,&#34;IBM Plex Mono&#34;,ui-monospace,monospace);font-size:10.5px;font-weight:500;letter-spacing:.07em">faible</text>
<text x="758" y="532" text-anchor="end" class="ll" style="fill:var(--graphite,#57564f);font-family:var(--font-code,&#34;IBM Plex Mono&#34;,ui-monospace,monospace);font-size:10.5px;font-weight:500;letter-spacing:.07em">élevée</text>

<path d="M190 490C280 438 358 390 430 338C510 280 584 225 684 154L724 214C626 282 550 338 468 398C382 460 302 506 220 542Z" fill="url(#cm-01-stip)" stroke="var(--line,#c9c1b3)" stroke-width=".9"/>
<text x="278" y="474" transform="rotate(-33 278 474)" class="ll h" style="fill:var(--graphite,#57564f);font-family:var(--font-code,&#34;IBM Plex Mono&#34;,ui-monospace,monospace);font-size:10.5px;font-weight:500;letter-spacing:.07em;paint-order:stroke;stroke:var(--paper,#f3efe6);stroke-width:3px">RELATION VALIDÉE</text>

<circle cx="398" cy="390" r="6" fill="var(--paper,#f3efe6)" stroke="var(--ink,#1c1c18)" stroke-width="1.2"/>
<text x="376" y="411" text-anchor="end" class="ll h" style="fill:var(--graphite,#57564f);font-family:var(--font-code,&#34;IBM Plex Mono&#34;,ui-monospace,monospace);font-size:10.5px;font-weight:500;letter-spacing:.07em;paint-order:stroke;stroke:var(--paper,#f3efe6);stroke-width:3px">SITUATION INITIALE</text>

<path d="M398 390C470 338 548 276 654 190" marker-end="url(#cm-01-arms)" style="fill:none;stroke:var(--moss,#52634e);stroke-width:1.6;vector-effect:non-scaling-stroke"/>
<text x="548" y="326" class="tsm h" style="fill:var(--moss,#52634e);font-family:var(--font-editorial,&#34;Newsreader&#34;,Georgia,serif);font-size:18px;font-weight:500;paint-order:stroke;stroke:var(--paper,#f3efe6);stroke-width:3px">Agir sur la propriété</text>
<text x="548" y="347" class="tt h" style="fill:var(--ink,#1c1c18);font-family:var(--font-interface,&#34;Inter&#34;,Arial,sans-serif);font-size:12.5px;font-weight:500;paint-order:stroke;stroke:var(--paper,#f3efe6);stroke-width:3px">la propriété progresse, puis le proxy suit</text>

<path d="M398 390C386 330 386 252 398 190" marker-end="url(#cm-01-arox)" style="fill:none;stroke:var(--oxide,#a84e2f);stroke-width:1.8;vector-effect:non-scaling-stroke"/>
<text x="218" y="286" class="tsm ox h" style="fill:var(--oxide,#a84e2f);font-family:var(--font-editorial,&#34;Newsreader&#34;,Georgia,serif);font-size:18px;font-weight:500;paint-order:stroke;stroke:var(--paper,#f3efe6);stroke-width:3px">Agir sur la mesure</text>
<text x="218" y="307" class="tt h" style="fill:var(--ink,#1c1c18);font-family:var(--font-interface,&#34;Inter&#34;,Arial,sans-serif);font-size:12.5px;font-weight:500;paint-order:stroke;stroke:var(--paper,#f3efe6);stroke-width:3px">le score monte ; la propriété ne bouge pas</text>

<path d="M398 190H654" style="fill:none;stroke:var(--oxide,#a84e2f);stroke-width:.9;stroke-dasharray:3 4;vector-effect:non-scaling-stroke"/>
<rect x="398" y="198" width="256" height="24" fill="url(#cm-01-hatch)"/>
<text x="526" y="181" text-anchor="middle" class="ll ox h" style="fill:var(--oxide,#a84e2f);font-family:var(--font-code,&#34;IBM Plex Mono&#34;,ui-monospace,monospace);font-size:10.5px;font-weight:500;letter-spacing:.07em;paint-order:stroke;stroke:var(--paper,#f3efe6);stroke-width:3px">MÊME SCORE FINAL</text>
<path d="M398 196V510M654 196V510" style="fill:none;stroke:var(--oxide,#a84e2f);stroke-width:.8;stroke-dasharray:3 5;vector-effect:non-scaling-stroke"/>
<text x="398" y="494" text-anchor="middle" class="ll ox h" style="fill:var(--oxide,#a84e2f);font-family:var(--font-code,&#34;IBM Plex Mono&#34;,ui-monospace,monospace);font-size:10.5px;font-weight:500;letter-spacing:.07em;paint-order:stroke;stroke:var(--paper,#f3efe6);stroke-width:3px">CIBLE INCHANGÉE</text>
<text x="654" y="494" text-anchor="middle" class="ll ms h" style="fill:var(--moss,#52634e);font-family:var(--font-code,&#34;IBM Plex Mono&#34;,ui-monospace,monospace);font-size:10.5px;font-weight:500;letter-spacing:.07em;paint-order:stroke;stroke:var(--paper,#f3efe6);stroke-width:3px">CIBLE AMÉLIORÉE</text>

<rect x="790" y="176" width="154" height="126" style="fill:var(--paper,#f3efe6);stroke:var(--moss,#52634e);stroke-width:.9"/>
<text x="867" y="199" text-anchor="middle" class="ll ms" style="fill:var(--moss,#52634e);font-family:var(--font-code,&#34;IBM Plex Mono&#34;,ui-monospace,monospace);font-size:10.5px;font-weight:500;letter-spacing:.07em">A · CIBLE</text>
<text x="867" y="228" text-anchor="middle" class="tt" style="fill:var(--ink,#1c1c18);font-family:var(--font-interface,&#34;Inter&#34;,Arial,sans-serif);font-size:12.5px;font-weight:500">propriété</text>
<path d="M867 236V258" marker-end="url(#cm-01-arms)" style="fill:none;stroke:var(--moss,#52634e);stroke-width:1.4"/>
