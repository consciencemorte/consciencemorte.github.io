<text x="867" y="460" text-anchor="middle" class="ll ox" style="fill:var(--oxide,#a84e2f);font-family:var(--font-code,&#34;IBM Plex Mono&#34;,ui-monospace,monospace);font-size:10.5px;font-weight:500;letter-spacing:.07em">PROPRIÉTÉ STABLE</text>

<path d="M60 578H940" style="fill:none;stroke:var(--line,#c9c1b3);stroke-width:.8;vector-effect:non-scaling-stroke"/>
<text x="500" y="610" text-anchor="middle" class="ll ox h" style="fill:var(--oxide,#a84e2f);font-family:var(--font-code,&#34;IBM Plex Mono&#34;,ui-monospace,monospace);font-size:10.5px;font-weight:500;letter-spacing:.07em;paint-order:stroke;stroke:var(--paper,#f3efe6);stroke-width:3px">L’ÉGALITÉ DU SCORE NE GARANTIT PAS L’ÉGALITÉ DU PROGRÈS</text>
</svg>
