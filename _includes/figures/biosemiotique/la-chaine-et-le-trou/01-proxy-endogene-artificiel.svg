<title id="cm-01-t">Quand la hausse cesse d’être endogène</title>
<desc id="cm-01-d">Graphique conceptuel opposant une hausse endogène du proxy, corrélée à l’amélioration de la propriété visée dans le domaine de validation, à une trajectoire optimisée où le score augmente surtout par action sur le dispositif de mesure.</desc>
