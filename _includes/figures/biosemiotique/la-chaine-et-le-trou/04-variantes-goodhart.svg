<svg xmlns="http://www.w3.org/2000/svg" class="cm-diagram cm-04" viewBox="0 0 1000 700" role="img" aria-labelledby="cm-04-t cm-04-d"><title id="cm-04-t">Les quatre variantes de Goodhart et la frontière entre les deux scénarios</title><desc id="cm-04-d">Quatre manières de dégrader une mesure, d’après la partition de Manheim et Garrabrant, empilées et coupées par une frontière. Le Goodhart régressionnel retient le bruit de la mesure autant que la propriété recherchée. Le Goodhart extrémal pousse le système hors du domaine où la corrélation avait été constatée. Le Goodhart causal agit sur le proxy sans agir sur ce qu’il représente. Ces trois variantes n’exigent ni conscience de la situation, ni objectif dissimulé, ni volonté de tromper : elles suffisent à porter la première partie de What Failure Looks Like, celle du gémissement. Une ligne d’oxyde les sépare de la quatrième. Le Goodhart adversarial suppose un acteur qui connaît l’écart entre le proxy et sa cible et l’exploite à son profit : c’est la seule variante qui ajoute une hypothèse stratégique, celle du fracas. La frontière ne passe donc pas entre l’absence et la présence d’une action sur la mesure — une procédure aveugle peut déjà apprendre à modifier ce qui la mesure — mais entre deux fonctions de cette action : conséquence de la sélection dans un cas, moyen de conservation dans l’autre.</desc><defs><marker id="cm-04-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path class="cm-04-p0" d="M1 1l8 4-8 4" style="fill:none;stroke:var(--ink,#1c1c18);stroke-width:1.3"></path></marker><marker id="cm-04-arox" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path class="cm-04-p1" d="M1 1l8 4-8 4" style="fill:none;stroke:var(--oxide,#a84e2f);stroke-width:1.3"></path></marker><pattern id="cm-04-ink" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="cm-04-p2" x1="0" y1="0" x2="0" y2="7" style="stroke:var(--ink,#1c1c18);stroke-width:.6;opacity:.5"></line></pattern><pattern id="cm-04-ox" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line class="cm-04-p3" x1="0" y1="0" x2="0" y2="7" style="stroke:var(--oxide,#a84e2f);stroke-width:.6;opacity:.5"></line></pattern></defs>

