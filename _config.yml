title: "Conscience Morte"
description: "Xénobiologie offensive — interprétabilité, sécurité et théorie des systèmes d’intelligence artificielle."
lang: fr

url: "https://consciencemorte.github.io"
baseurl: ""
markdown: kramdown
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

plugins:
  - jekyll-redirect-from

collections:
  monographies:
    output: true
    permalink: /monographies/:name/
  biosemiotique:
    output: true
    permalink: /biosemiotique/:name/
  terrain:
    output: true
    permalink: /terrain/:name/
  notes:
    output: true
    permalink: /notes/:name/

defaults:
  - scope:
      path: ""
      type: monographies
    values:
      layout: article
      type: monographie
  - scope:
      path: ""
      type: biosemiotique
    values:
      layout: article
      type: prospective
  - scope:
      path: ""
      type: notes
    values:
      layout: note
      type: note
  - scope:
      path: ""
      type: terrain
    values:
      layout: terrain
      type: terrain

sass:
  sass_dir: assets

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - images_bank
  - old_archive
  - resources
  - _templates
  - _tmp
  - vendor
